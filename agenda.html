<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda - Secretária IA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --surface: #ffffff; --text: #1e293b; --muted: #64748b; --border: #e2e8f0; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; }
        
        aside { width: 250px; background: var(--surface); border-right: 1px solid var(--border); padding: 2rem 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
        .logo { font-size: 1.25rem; font-weight: 700; color: var(--primary); text-decoration: none; margin-bottom: 2rem; display: block; }
        aside a { color: var(--muted); text-decoration: none; padding: 0.75rem 1rem; border-radius: 8px; font-weight: 500; transition: all 0.2s; }
        aside a:hover, aside a.active { background: #eff6ff; color: var(--primary); }
        
        main { flex: 1; padding: 2rem 3rem; overflow-y: auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        h1 { font-size: 1.75rem; font-weight: 700; }
        
        .event-list { display: flex; flex-direction: column; gap: 1rem; }
        .event-card { background: var(--surface); padding: 1.25rem; border-radius: 12px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .event-time { font-weight: 600; color: var(--primary); min-width: 80px; }
        .event-title { font-weight: 500; flex: 1; }
        .event-status { font-size: 0.8rem; padding: 0.25rem 0.75rem; border-radius: 20px; background: #dcfce7; color: #166534; }
        
        @media (max-width: 768px) {
            body { flex-direction: column; }
            aside { width: 100%; flex-direction: row; overflow-x: auto; padding: 1rem; border-right: none; border-bottom: 1px solid var(--border); }
            main { padding: 1.5rem; }
        }
    </style>
</head>
<body>
    <aside>
        <a href="index.html" class="logo">🤖 Secretária IA</a>
        <a href="painel.html"> Visão Geral</a>
        <a href="agenda.html" class="active">📅 Agenda</a>
        <a href="clientes.html">👥 Clientes</a>
        <a href="orcamentos.html">💰 Orçamentos</a>
        <a href="bate-papo.html">💬 Chat IA</a>
        <a href="login.html" style="margin-top: auto; color: #ef4444;">Sair</a>
    </aside>

    <main>
        <header>
            <h1>Minha Agenda 📅</h1>
            <button style="background: var(--primary); color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 8px; font-weight: 600; cursor: pointer;">+ Novo Agendamento</button>
        </header>

        <div class="event-list">
            <div class="event-card">
                <span class="event-time">09:00</span>
                <span class="event-title">Reunião com Cliente Silva</span>
                <span class="event-status">Confirmado</span>
            </div>
            <div class="event-card">
                <span class="event-time">14:30</span>
                <span class="event-title">Almoço de Negócios - Restaurante X</span>
                <span class="event-status">Pendente</span>
            </div>
            <div class="event-card">
                <span class="event-time">16:00</span>
                <span class="event-title">Call de Alinhamento Equipe</span>
                <span class="event-status">Confirmado</span>
            </div>
        </div>
    </main>
</body>
</html>
