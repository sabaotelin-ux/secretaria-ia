<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda - Secretária IA Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans min-h-screen">

    <div class="max-w-3xl mx-auto px-4 py-8">

        <!-- Cabeçalho -->
        <header class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 mb-6 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold text-slate-900">Agenda de Compromissos</h1>
                <p class="text-sm text-slate-500">Organize seus horários</p>
            </div>
            <a href="dashboard.html" class="text-indigo-600 text-sm font-medium hover:underline">
                ← Voltar
            </a>
        </header>

        <!-- Formulário -->
        <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-5 mb-6">
            <h2 class="font-bold text-slate-900 mb-4">Novo Compromisso</h2>
            
            <div class="space-y-3">
                <input type="text" id="cliente" placeholder="Nome do cliente" 
                    class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                
                <div class="grid grid-cols-2 gap-3">
                    <input type="date" id="data" 
                        class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    
                    <input type="time" id="hora" 
                        class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>

                <button onclick="adicionarCompromisso()" 
                    class="w-full bg-indigo-600 text-white font-semibold py-3 rounded-xl hover:bg-indigo-700 transition">
                    Salvar Agendamento
                </button>
            </div>
        </div>

        <!-- Lista -->
        <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-5">
            <div class="flex justify-between items-center mb-4">
                <h2 class="font-bold text-slate-900">Próximos Compromissos</h2>
                <button onclick="limparAgenda()" class="text-xs text-red-500 hover:underline">Limpar tudo</button>
            </div>
            
            <div id="listaCompromissos" class="space-y-3">
                <!-- Os compromissos aparecerão aqui -->
            </div>
        </div>

    </div>

    <script>
        // Carrega os compromissos salvos ao abrir a página
        document.addEventListener('DOMContentLoaded', carregarCompromissos);

        function adicionarCompromisso() {
            const cliente = document.getElementById('cliente').value.trim();
            const data = document.getElementById('data').value;
            const hora = document.getElementById('hora').value;

            if (!cliente || !data || !hora) {
                alert('Por favor, preencha todos os campos.');
                return;
            }

            const compromisso = {
                id: Date.now(),
                cliente,
                data,
                hora
            };

            // Pega a lista atual
            let compromissos = JSON.parse(localStorage.getItem('compromissos')) || [];
            compromissos.push(compromisso);

            // Salva
            localStorage.setItem('compromissos', JSON.stringify(compromissos));

            // Limpa campos
            document.getElementById('cliente').value = '';
            document.getElementById('data').value = '';
            document.getElementById('hora').value = '';

            // Atualiza a tela
            carregarCompromissos();
        }

        function carregarCompromissos() {
            const lista = document.getElementById('listaCompromissos');
            const compromissos = JSON.parse(localStorage.getItem('compromissos')) || [];

            if (compromissos.length === 0) {
                lista.innerHTML = '<p class="text-slate-500 text-sm">Nenhum compromisso agendado ainda.</p>';
                return;
            }

            // Ordena por data
            compromissos.sort((a, b) => new Date(a.data + 'T' + a.hora) - new Date(b.data + 'T' + b.hora));

            lista.innerHTML = compromissos.map(c => {
                const dataFormatada = new Date(c.data + 'T00:00:00').toLocaleDateString('pt-BR');
                return `
                    <div class="flex justify-between items-center p-3 bg-slate-50 rounded-xl">
                        <div>
                            <p class="font-medium text-slate-900">${c.cliente}</p>
                            <p class="text-sm text-slate-500">${dataFormatada} às ${c.hora}</p>
                        </div>
                        <button onclick="removerCompromisso(${c.id})" class="text-red-500 text-sm hover:underline">Remover</button>
                    </div>
                `;
            }).join('');
        }

        function removerCompromisso(id) {
            let compromissos = JSON.parse(localStorage.getItem('compromissos')) || [];
            compromissos = compromissos.filter(c => c.id !== id);
            localStorage.setItem('compromissos', JSON.stringify(compromissos));
            carregarCompromissos();
        }

        function limparAgenda() {
            if (confirm('Tem certeza que deseja apagar todos os compromissos?')) {
                localStorage.removeItem('compromissos');
                carregarCompromissos();
            }
        }
    </script>

</body>
</html>
