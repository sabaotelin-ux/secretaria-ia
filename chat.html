<script>
  // Cole sua chave completa aqui (a que começa com AQ.)
  const GEMINI_API_KEY = "AQ.Ab8RN6JruGDq-DW_nVnTdr07gS6VUtFBFulzxLsClphdW4E0jg";

  const chatArea = document.getElementById("chatArea");
  const userInput = document.getElementById("userInput");

  let conversationHistory = [
    {
      role: "user",
      parts: [{ text: "Você é a Secretária IA Pro, uma assistente virtual profissional, educada e eficiente. Responda sempre em português brasileiro de forma clara e útil." }]
    },
    {
      role: "model",
      parts: [{ text: "Entendido! Estou pronta para ajudar." }]
    }
  ];

  function addMessage(text, isUser = false) {
    const div = document.createElement("div");
    div.className = `flex gap-3 ${isUser ? "justify-end" : ""}`;

    if (isUser) {
      div.innerHTML = `
        <div class="bg-indigo-600 text-white rounded-2xl rounded-tr-none px-4 py-3 max-w-[85%]">
          <p class="text-sm">${text}</p>
        </div>
      `;
    } else {
      div.innerHTML = `
        <div class="w-8 h-8 bg-indigo-100 rounded-full flex items-center justify-center text-sm flex-shrink-0">🤖</div>
        <div class="bg-slate-100 rounded-2xl rounded-tl-none px-4 py-3 max-w-[85%]">
          <p class="text-sm text-slate-800 whitespace-pre-wrap">${text}</p>
        </div>
      `;
    }

    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  async function sendMessage() {
    const message = userInput.value.trim();
    if (!message) return;

    addMessage(message, true);
    userInput.value = "";
    userInput.disabled = true;

    conversationHistory.push({
      role: "user",
      parts: [{ text: message }]
    });

    try {
      const response = await fetch(
        "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-goog-api-key": GEMINI_API_KEY
          },
          body: JSON.stringify({
            contents: conversationHistory
          })
        }
      );

      const data = await response.json();

      if (data.error) {
        addMessage("Erro: " + (data.error.message || "Verifique a chave"));
        console.error(data.error);
        return;
      }

      const reply = data.candidates[0].content.parts[0].text;

      conversationHistory.push({
        role: "model",
        parts: [{ text: reply }]
      });

      addMessage(reply);

    } catch (error) {
      addMessage("Erro de conexão. Tente novamente.");
      console.error(error);
    }

    userInput.disabled = false;
    userInput.focus();
  }
</script>
