<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - Secretária IA Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans min-h-screen flex flex-col">

    <div class="max-w-3xl mx-auto w-full px-4 py-6 flex flex-col flex-1">

        <!-- Cabeçalho -->
        <header class="bg-white rounded-2xl shadow-sm border border-slate-100 p-4 mb-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-indigo-100 rounded-full flex items-center justify-center text-xl">🤖</div>
                <div>
                    <h1 class="font-bold text-slate-900">Secretária IA</h1>
                    <p class="text-xs text-green-600">Online • Powered by Gemini</p>
                </div>
            </div>
            <a href="dashboard.html" class="text-indigo-600 text-sm font-medium hover:underline">
                ← Voltar
            </a>
        </header>

        <!-- Área de mensagens -->
        <div id="chatArea" class="flex-1 bg-white rounded-2xl border border-slate-100 shadow-sm p-4 overflow-y-auto mb-4 space-y-4" style="min-height: 420px; max-height: 520px;">
            <div class="flex gap-3">
                <div class="w-8 h-8 bg-indigo-100 rounded-full flex items-center justify-center text-sm flex-shrink-0">🤖</div>
                <div class="bg-slate-100 rounded-2xl rounded-tl-none px-4 py-3 max-w-[85%]">
                    <p class="text-sm text-slate-800">Olá! Eu sou a <strong>Secretária IA Pro</strong>. Posso te ajudar com:</p>
                    <ul class="text-sm text-slate-700 mt-2 space-y-1 list-disc list-inside">
                        <li>Agendar compromissos</li>
                        <li>Gerar orçamentos</li>
                        <li>Atender clientes</li>
                        <li>Organizar sua rotina</li>
                    </ul>
                    <p class="text-sm text-slate-800 mt-2">Como posso te ajudar hoje?</p>
                </div>
            </div>
        </div>

        <!-- Input -->
        <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-3 flex gap-2">
            <input 
                type="text" 
                id="userInput" 
                placeholder="Digite sua mensagem..." 
                class="flex-1 px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm"
                onkeypress="if(event.key === 'Enter') sendMessage()"
            >
            <button 
                onclick="sendMessage()" 
                class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-3 rounded-xl font-medium text-sm transition"
            >
                Enviar
            </button>
        </div>
    </div>

    <script>
        // ⚠️ COLE SUA CHAVE AQUI (nunca compartilhe publicamente)
        const GEMINI_API_KEY = "AQ.Ab8RN6LfQwxWKUr5wb21PwcE7SE0YvftkUmIsslHQ7dUpSR73w";

        const chatArea = document.getElementById("chatArea");
        const userInput = document.getElementById("userInput");

        // Histórico da conversa
        let conversationHistory = [
            {
                role: "user",
                parts: [{ text: "Você é a Secretária IA Pro, uma assistente virtual profissional, educada e eficiente. Responda sempre em português brasileiro de forma clara e útil. Ajude com agenda, orçamentos, clientes e organização." }]
            },
            {
                role: "model",
                parts: [{ text: "Entendido! Estou pronta para ajudar." }]
            }
        ];

        function addMessage(text, isUser = false) {
            const div = document.createElement("div");
            div.className = `flex gap-3 ${isUser ? "justify-end" : ""}`;

            if (isUser) {
                div.innerHTML = `
                    <div class="bg-indigo-600 text-white rounded-2xl rounded-tr-none px-4 py-3 max-w-[85%]">
                        <p class="text-sm">${text}</p>
                    </div>
                    <div class="w-8 h-8 bg-indigo-600 rounded-full flex items-center justify-center text-sm text-white flex-shrink-0">Você</div>
                `;
            } else {
                div.innerHTML = `
                    <div class="w-8 h-8 bg-indigo-100 rounded-full flex items-center justify-center text-sm flex-shrink-0">🤖</div>
                    <div class="bg-slate-100 rounded-2xl rounded-tl-none px-4 py-3 max-w-[85%]">
                        <p class="text-sm text-slate-800 whitespace-pre-wrap">${text}</p>
                    </div>
                `;
            }

            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            // Mostra mensagem do usuário
            addMessage(message, true);
            userInput.value = "";
            userInput.disabled = true;

            // Adiciona no histórico
            conversationHistory.push({
                role: "user",
                parts: [{ text: message }]
            });

            try {
                const response = await fetch(
                    `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_API_KEY}`,
                    {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            contents: conversationHistory
                        })
                    }
                );

                const data = await response.json();

                if (data.error) {
                    addMessage("Desculpe, ocorreu um erro: " + data.error.message);
                    return;
                }

                const reply = data.candidates[0].content.parts[0].text;
                
                // Adiciona resposta no histórico
                conversationHistory.push({
                    role: "model",
                    parts: [{ text: reply }]
                });

                addMessage(reply);

            } catch (error) {
                addMessage("Erro de conexão. Verifique sua chave da API ou tente novamente.");
                console.error(error);
            }

            userInput.disabled = false;
            userInput.focus();
        }
    </script>
</body>
</html>
