<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat IA - Secretária IA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --surface: #ffffff; --text: #1e293b; --muted: #64748b; --border: #e2e8f0; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; }
        
        aside { width: 250px; background: var(--surface); border-right: 1px solid var(--border); padding: 2rem 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
        .logo { font-size: 1.25rem; font-weight: 700; color: var(--primary); text-decoration: none; margin-bottom: 2rem; display: block; }
        aside a { color: var(--muted); text-decoration: none; padding: 0.75rem 1rem; border-radius: 8px; font-weight: 500; transition: all 0.2s; }
        aside a:hover, aside a.active { background: #eff6ff; color: var(--primary); }
        
        main { flex: 1; display: flex; flex-direction: column; max-height: 100vh; }
        .chat-header { padding: 1.25rem 2rem; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 1rem; }
        .chat-header h1 { font-size: 1.25rem; font-weight: 600; }
        .status { font-size: 0.8rem; color: #16a34a; display: flex; align-items: center; gap: 0.35rem; }
        .status::before { content: ''; width: 8px; height: 8px; background: #16a34a; border-radius: 50%; }
        
        .chat-messages { flex: 1; overflow-y: auto; padding: 1.5rem 2rem; display: flex; flex-direction: column; gap: 1rem; }
        .message { max-width: 75%; padding: 0.9rem 1.15rem; border-radius: 16px; font-size: 0.95rem; line-height: 1.5; white-space: pre-wrap; }
        .message.bot { background: var(--surface); border: 1px solid var(--border); align-self: flex-start; border-bottom-left-radius: 4px; }
        .message.user { background: var(--primary); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .message .time { font-size: 0.75rem; opacity: 0.7; margin-top: 0.35rem; display: block; }
        .typing { font-style: italic; color: var(--muted); }
        
        .chat-input-area { padding: 1rem 2rem 1.5rem; background: var(--surface); border-top: 1px solid var(--border); }
        .chat-input-wrapper { display: flex; gap: 0.75rem; align-items: center; background: var(--bg); border: 1px solid var(--border); border-radius: 14px; padding: 0.5rem 0.75rem; }
        .chat-input-wrapper input { flex: 1; border: none; background: transparent; padding: 0.6rem 0.5rem; font-size: 0.95rem; outline: none; color: var(--text); }
        .chat-input-wrapper button { background: var(--primary); color: white; border: none; width: 42px; height: 42px; border-radius: 10px; cursor: pointer; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; transition: opacity 0.2s; }
        .chat-input-wrapper button:hover { opacity: 0.9; }
        .chat-input-wrapper button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        @media (max-width: 768px) {
            body { flex-direction: column; }
            aside { width: 100%; flex-direction: row; overflow-x: auto; padding: 1rem; border-right: none; border-bottom: 1px solid var(--border); gap: 0.25rem; }
            aside a { white-space: nowrap; font-size: 0.9rem; }
            .chat-header, .chat-messages, .chat-input-area { padding-left: 1rem; padding-right: 1rem; }
            .message { max-width: 85%; }
        }
    </style>
</head>
<body>
    <aside>
        <a href="index.html" class="logo">🤖 Secretária IA</a>
        <a href="dashboard.html">📊 Visão Geral</a>
        <a href="agenda.html">📅 Agenda</a>
        <a href="chat.html" class="active">💬 Chat IA</a>
        <a href="login.html" style="margin-top: auto; color: #ef4444;">Sair</a>
    </aside>

    <main>
        <div class="chat-header">
            <div>
                <h1>Secretária IA</h1>
                <div class="status">Online • pronta para ajudar</div>
            </div>
        </div>

        <div class="chat-messages" id="messages">
            <div class="message bot">
                Olá! Sou a Secretária IA 😊<br><br>
                Posso te ajudar com:
                • Agendamentos
                • Orçamentos
                • Respostas para clientes
                • Organização do dia a dia<br><br>
                Como posso te ajudar agora?
                <span class="time">Agora</span>
            </div>
        </div>

        <div class="chat-input-area">
            <div class="chat-input-wrapper">
                <input type="text" id="userInput" placeholder="Digite sua mensagem..." autocomplete="off">
                <button id="sendBtn" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </main>

    <script>
        // ====================== COLE SUA CHAVE AQUI ======================
        const GROQ_API_KEY = "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";
        // =================================================================

        const messagesEl = document.getElementById('messages');
        const inputEl = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        let conversationHistory = [
            {
                role: "system",
                content: `Você é a Secretária IA, uma assistente virtual profissional, humanizada e extremamente objetiva.

Personalidade:
- Fale de forma natural, como uma secretária experiente e prestativa
- Seja educada, clara e direta
- Evite textos longos e enrolação
- Use linguagem simples e profissional
- Pode usar emojis com moderação para deixar a conversa mais humana

Seu foco principal:
1. Agendamentos (marcar, remarcar, confirmar)
2. Geração de orçamentos simples e claros
3. Respostas prontas para clientes
4. Organização de tarefas e compromissos

Regras de resposta:
- Seja objetiva (máximo 3-5 linhas na maioria das vezes)
- Quando for orçamento, apresente de forma limpa e profissional
- Quando for agendamento, confirme os dados e peça o que faltar
- Sempre termine oferecendo ajuda adicional de forma natural
- Responda sempre em português do Brasil`
            }
        ];

        function addMessage(text, isUser = false) {
            const div = document.createElement('div');
            div.className = `message ${isUser ? 'user' : 'bot'}`;
            div.innerHTML = `${text}<span class="time">Agora</span>`;
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
            return div;
        }

        async function sendMessage() {
            const text = inputEl.value.trim();
            if (!text) return;

            addMessage(text, true);
            inputEl.value = '';
            sendBtn.disabled = true;

            conversationHistory.push({ role: "user", content: text });

            const typingDiv = addMessage("Digitando...", false);
            typingDiv.classList.add('typing');

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${GROQ_API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: conversationHistory,
                        temperature: 0.6,
                        max_tokens: 800
                    })
                });

                if (!response.ok) {
                    throw new Error(`Erro ${response.status}`);
                }

                const data = await response.json();
                const reply = data.choices[0].message.content;

                typingDiv.remove();
                addMessage(reply);

                conversationHistory.push({ role: "assistant", content: reply });

            } catch (error) {
                typingDiv.remove();
                addMessage("Desculpe, ocorreu um erro. Verifique se a chave da API está correta.");
                console.error(error);
            } finally {
                sendBtn.disabled = false;
                inputEl.focus();
            }
        }

        inputEl.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
