<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Secretária IA Pro</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f4f6fb;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card {
            background: #ffffff;
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 { color: #1e3a8a; font-size: 22px; margin-bottom: 8px; }
        p { color: #4b5563; font-size: 13px; margin-bottom: 24px; }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
        }
        .btn {
            display: block;
            width: 100%;
            background-color: #2563eb;
            color: #ffffff;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
        }
        .btn:hover { background-color: #1d4ed8; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Secretária IA Pro</h1>
        <p>Faça login para acessar o painel</p>
        
        <form action="painel.html" method="GET">
            <input type="email" placeholder="Seu e-mail" required>
            <input type="password" placeholder="Sua senha" required>
            <button type="submit" class="btn">Entrar</button>
        </form>
    </div>

</body>
</html>
