<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel - Secretária IA Pro</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f4f6fb;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .card-painel {
            background: #ffffff;
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            color: #1e3a8a;
            font-size: 22px;
            margin-bottom: 8px;
        }

        p {
            color: #4b5563;
            font-size: 13px;
            margin-bottom: 24px;
        }

        .menu-opcoes {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-opcao {
            display: block;
            background-color: #2563eb;
            color: #ffffff;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            transition: background 0.3s;
        }

        .btn-opcao:hover {
            background-color: #1d4ed8;
        }

        .btn-sair {
            background-color: #ef4444;
        }

        .btn-sair:hover {
            background-color: #dc2626;
        }
    </style>
</head>
<body>

    <div class="card-painel">
        <h1>Painel de Controle</h1>
        <p>Gerencie sua assistente virtual e clientes</p>
        
        <div class="menu-opcoes">
            <!-- Usando links simples e seguros -->
            <a href="clientes.html" class="btn-opcao">Ver Clientes Atendidos</a>
            <a href="index.html" class="btn-opcao btn-sair">Sair da Conta</a>
        </div>
    </div>

</body>
</html>
