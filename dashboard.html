<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel - Secretária IA Pro</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 20px;
            background-color: #f4f6fb;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        header {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 { color: #1e3a8a; font-size: 20px; margin: 0; }
        .logout { color: #dc2626; text-decoration: none; font-size: 14px; font-weight: bold; }
        
        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }
        .card-menu {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-decoration: none;
            color: #1e3a8a;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: 0.2s;
        }
        .card-menu:hover {
            background-color: #eff6ff;
            transform: translateY(-2px);
        }
        .card-menu span { font-size: 22px; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Painel da IA Pro</h1>
            <a href="index.html" class="logout">Sair</a>
        </header>

        <div class="grid">
            <a href="clientes.html" class="card-menu">
                <div>
                    <h3>Clientes Atendidos</h3>
                    <p style="color: #6b7280; font-size: 13px; font-weight: normal; margin: 5px 0 0 0;">Veja o histórico de conversas</p>
                </div>
                <span>👥</span>
            </a>

            <a href="#" class="card-menu" onclick="alert('Módulo de Agendamentos em breve!')">
                <div>
                    <h3>Agenda de Compromissos</h3>
                    <p style="color: #6b7280; font-size: 13px; font-weight: normal; margin: 5px 0 0 0;">Gerencie horários marcados</p>
                </div>
                <span>📅</span>
            </a>

            <a href="#" class="card-menu" onclick="alert('Módulo de Orçamentos em breve!')">
                <div>
                    <h3>Gerador de Orçamentos</h3>
                    <p style="color: #6b7280; font-size: 13px; font-weight: normal; margin: 5px 0 0 0;">Crie propostas automáticas</p>
                </div>
                <span>💰</span>
            </a>
        </div>
    </div>

</body>
</html>
