<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel - Secretária IA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --surface: #ffffff; --text: #1e293b; --muted: #64748b; --border: #e2e8f0; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; }
        
        /* Sidebar Lateral */
        aside { width: 250px; background: var(--surface); border-right: 1px solid var(--border); padding: 2rem 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
        .logo { font-size: 1.25rem; font-weight: 700; color: var(--primary); text-decoration: none; margin-bottom: 2rem; display: block; }
        aside a { color: var(--muted); text-decoration: none; padding: 0.75rem 1rem; border-radius: 8px; font-weight: 500; transition: all 0.2s; }
        aside a:hover, aside a.active { background: #eff6ff; color: var(--primary); }
        
        /* Conteúdo Principal */
        main { flex: 1; padding: 2rem 3rem; overflow-y: auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        h1 { font-size: 1.75rem; font-weight: 700; }
        
        /* Cards do Dashboard */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.5rem; }
        .card { background: var(--surface); padding: 1.5rem; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 2px 4px rgb(0 0 0 / 0.02); }
        .card h3 { font-size: 0.875rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem; }
        .card .value { font-size: 2rem; font-weight: 700; color: var(--text); }
        
        @media (max-width: 768px) {
            body { flex-direction: column; }
            aside { width: 100%; flex-direction: row; overflow-x: auto; padding: 1rem; border-right: none; border-bottom: 1px solid var(--border); }
            main { padding: 1.5rem; }
        }
    </style>
</head>
<body>
    <!-- Menu Lateral -->
    <aside>
        <a href="index.html" class="logo">🤖 Secretária IA</a>
        <a href="painel.html" class="active">📊 Visão Geral</a>
        <a href="agenda.html">📅 Agenda</a>
        <a href="clientes.html">👥 Clientes</a>
        <a href="orcamentos.html">💰 Orçamentos</a>
        <a href="bate-papo.html">💬 Chat IA</a>
        <a href="login.html" style="margin-top: auto; color: #ef4444;">Sair</a>
    </aside>

    <!-- Área Principal -->
    <main>
        <header>
            <h1>Bom dia, Usuário! 👋</h1>
            <div style="font-size: 0.9rem; color: var(--muted);">Última atualização: Agora</div>
        </header>

        <section class="grid">
            <div class="card">
                <h3>Compromissos Hoje</h3>
                <div class="value">3</div>
            </div>
            <div class="card">
                <h3>Novos Clientes</h3>
                <div class="value">12</div>
            </div>
            <div class="card">
                <h3>Orçamentos Pendentes</h3>
                <div class="value">5</div>
            </div>
            <div class="card">
                <h3>Mensagens Não Lidas</h3>
                <div class="value">8</div>
            </div>
        </section>
    </main>
</body>
</html>
